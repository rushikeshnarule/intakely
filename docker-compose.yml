version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: intakely_postgres
    environment:
      POSTGRES_DB: intakely
      POSTGRES_USER: intakely_owner
      POSTGRES_PASSWORD: intakely_owner_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intakely_owner -d intakely"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: intakely_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@intakely.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

volumes:
  pgdata:
